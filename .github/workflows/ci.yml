name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # core declares no dependencies
      - name: core has zero dependencies
        run: |
          test "$(node -p "JSON.stringify(require('./core/package.json').dependencies)")" = '{}'
      # lint carries the boundary guard, so it runs before anything slower
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
